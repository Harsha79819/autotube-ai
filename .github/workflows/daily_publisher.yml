name: AutoTube AI 24/7 Daily Multi-Channel Publisher

on:
  schedule:
    # 24/7 Cloud Automated Publishing for Channel 1 & Channel 2 (10 Daily Slots)
    # Target Publish Times (IST):
    # CH1-S1 (08:00 IST) -> Trigger 07:35 IST (02:05 UTC)
    - cron: '5 2 * * *'
    # CH2-S1 (08:45 IST) -> Trigger 08:20 IST (02:50 UTC)
    - cron: '50 2 * * *'
    # CH1-L1 (12:30 IST) -> Trigger 11:55 IST (06:25 UTC)
    - cron: '25 6 * * *'
    # CH2-L1 (13:30 IST) -> Trigger 12:55 IST (07:25 UTC)
    - cron: '25 7 * * *'
    # CH1-S2 (16:00 IST) -> Trigger 15:35 IST (10:05 UTC)
    - cron: '5 10 * * *'
    # CH2-S2 (17:00 IST) -> Trigger 16:35 IST (11:05 UTC)
    - cron: '5 11 * * *'
    # CH2-S3 (19:00 IST) -> Trigger 18:35 IST (13:05 UTC)
    - cron: '5 13 * * *'
    # CH1-S3 (19:45 IST) -> Trigger 19:20 IST (13:50 UTC)
    - cron: '50 13 * * *'
    # CH2-L2 (21:00 IST) -> Trigger 20:25 IST (14:55 UTC)
    - cron: '55 14 * * *'
    # CH1-L2 (22:00 IST) -> Trigger 21:25 IST (15:55 UTC)
    - cron: '55 15 * * *'

  workflow_dispatch:
    inputs:
      custom_topic:
        description: '🎯 Type ANY Custom Topic (Leave empty to run scheduled slot below)'
        required: false
        default: ''
        type: string
      custom_channel:
        description: 'Channel for Custom Topic'
        required: false
        default: 'viral_talks_me&mine'
        type: choice
        options:
          - 'viral_talks_me&mine'
          - 'Imaginary_facts'
      custom_duration:
        description: 'Duration for Custom Topic'
        required: false
        default: '60-90s'
        type: choice
        options:
          - '60-90s'
          - '3-5m'
          - '5-8m'
      slot_id:
        description: 'OR Select Scheduled Slot ID'
        required: true
        default: 'RUN_ALL_PENDING'
        type: choice
        options:
          - 'RUN_ALL_PENDING'
          - 'CH1-S1'
          - 'CH2-S1'
          - 'CH1-L1'
          - 'CH2-L1'
          - 'CH1-S2'
          - 'CH2-S2'
          - 'CH2-S3'
          - 'CH1-S3'
          - 'CH2-L2'
          - 'CH1-L2'
      force:
        description: 'Force execution even if already succeeded today'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  publish_video:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: 🎥 Install FFmpeg & System Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg libsm6 libxext6 libgl1 libgl1-mesa-glx fonts-dejavu || sudo apt-get install -y ffmpeg libsm6 libxext6 libgl1 fonts-dejavu

      - name: 📦 Install Python Requirements
        run: |
          python -m pip install --upgrade pip setuptools wheel
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 🔑 Restore OAuth Tokens & Credentials
        env:
          TOKEN_CH1_B64: ${{ secrets.YOUTUBE_TOKEN_JSON_B64 }}
          TOKEN_CH2_B64: ${{ secrets.YOUTUBE_TOKEN_CH2_JSON_B64 }}
          CLIENT_SECRET_B64: ${{ secrets.CLIENT_SECRET_JSON_B64 }}
        run: |
          if [ -n "$TOKEN_CH1_B64" ]; then
            echo "$TOKEN_CH1_B64" | base64 -d > token.json
            echo "✅ Channel 1 token restored"
          fi
          if [ -n "$TOKEN_CH2_B64" ]; then
            echo "$TOKEN_CH2_B64" | base64 -d > token_channel2.json
            echo "✅ Channel 2 token restored"
          fi
          if [ -n "$CLIENT_SECRET_B64" ]; then
            echo "$CLIENT_SECRET_B64" | base64 -d > client_secret.json
            echo "✅ Client secret restored"
          fi

      - name: 🚀 Execute Production & Upload
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          DAILY_UPLOAD_PRIVACY: "public"
          ENABLE_AUTO_UPLOAD: "1"
          DAILY_AUTO_GENERATE: "true"
          SCHEDULED_CHANNELS: "both"
          CUSTOM_TOPIC: ${{ github.event.inputs.custom_topic }}
          CUSTOM_CHANNEL: ${{ github.event.inputs.custom_channel }}
          CUSTOM_DURATION: ${{ github.event.inputs.custom_duration }}
          INPUT_SLOT: ${{ github.event.inputs.slot_id }}
          INPUT_FORCE: ${{ github.event.inputs.force }}
        run: |
          echo "=========================================================="
          echo "🚀 AutoTube AI Cloud Publishing Run Starting"
          echo "=========================================================="
          
          if [ -n "$CUSTOM_TOPIC" ]; then
            echo "🎯 Executing Custom On-Demand Video: $CUSTOM_TOPIC"
            python daily_scheduler.py --custom-topic "$CUSTOM_TOPIC" --custom-channel "$CUSTOM_CHANNEL" --custom-duration "$CUSTOM_DURATION"
          elif [ "$INPUT_SLOT" != "" ] && [ "$INPUT_SLOT" != "RUN_ALL_PENDING" ]; then
            echo "🎯 Executing specific target slot: $INPUT_SLOT"
            FORCE_FLAG=""
            if [ "$INPUT_FORCE" = "true" ]; then FORCE_FLAG="--force"; fi
            python daily_scheduler.py --slot "$INPUT_SLOT" $FORCE_FLAG
          else
            echo "⏰ Running single scheduled slot for current window..."
            python daily_scheduler.py --run-current
          fi

      - name: 📊 Display Slot Status Summary & 24/7 Channel Health
        if: always()
        run: |
          python daily_scheduler.py --status
          python analytics/channel_monitor.py || true

      - name: 💾 Persist Upload Logs & State to Repository
        if: always()
        run: |
          git config --global user.name "AutoTube Bot"
          git config --global user.email "bot@autotube.ai"
          git add logs/daily_slot_status.json output/uploaded_videos.json data/used_topics.json logs/github_actions_usage.json logs/channel_health_report.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(auto): update daily slot status & uploaded video ledger [skip ci]"
            for attempt in 1 2 3; do
              echo "🔄 Syncing state to GitHub (Attempt $attempt)..."
              git fetch origin main || true
              git rebase -X ours origin/main || git rebase --abort || true
              if git push origin main; then
                echo "✅ Successfully synced logs and used topics to GitHub"
                break
              fi
              echo "⚠️ Push failed, retrying in 5 seconds..."
              sleep 5
            done
          else
            echo "No state changes to commit"
          fi
